version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swapi_postgres
    environment:
      POSTGRES_DB: swapi_db
      POSTGRES_USER: swapi_user
      POSTGRES_PASSWORD: swapi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
